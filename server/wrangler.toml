#:schema node_modules/wrangler/config-schema.json
name = "delightmail-server"
main = "src/index.ts"
compatibility_date = "2025-05-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[ai]
binding = "AI"

# Durable Object migrations — all classes are SQLite-backed.
[[migrations]]
tag = "v1"
new_sqlite_classes = [
	"AuthServer",
	"MailboxServer",
	"SyncEngine",
	"AppWebsocketServer",
	"RateLimiterServer",
]

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthServer"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MailboxServer"

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncEngine"

[[durable_objects.bindings]]
name = "WS"
class_name = "AppWebsocketServer"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterServer"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "delightmail"

# Cloudflare Email Service — outbound sending for cf_domain identities (§6).
# Requires domain onboarding (DKIM/SPF/DMARC managed by Cloudflare). Deployers
# without Email Service point cf_domain identities at an SMTP relay instead.
[[send_email]]
name = "EMAIL"

# Cloudflare Email Routing → email() handler. Enable catch-all "Send to Worker"
# in the dashboard and point it at this worker (§5.2).
[[rules]]
type = "ESModule"
globs = ["**/*.ts"]
