allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@delightstack/ai"
  - "@delightstack/auth"
  - "@delightstack/components"
  - "@delightstack/database"
  - "@delightstack/editor"
  - "@delightstack/images"
  - "@delightstack/rate-limiter"
  - "@delightstack/styles"
  - "@delightstack/utilities"
  - "@delightstack/websocket"
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@sveltejs/kit"
