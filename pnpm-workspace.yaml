# This repo is a single package; the file exists for the pnpm settings below.
# pnpm 10 (Cloudflare Builds' default) hard-errors on a workspace file with no
# `packages` field, so declare the root explicitly.
packages:
  - "."

allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@delightstack/ai"
  - "@delightstack/auth"
  - "@delightstack/components"
  - "@delightstack/database"
  - "@delightstack/editor"
  - "@delightstack/images"
  - "@delightstack/rate-limiter"
  - "@delightstack/styles"
  - "@delightstack/utilities"
  - "@delightstack/websocket"
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@sveltejs/kit"
