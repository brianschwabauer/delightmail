# TEMPORARY: sync-durability fixes (silent client-index doc loss) are vendored
# as tarballs (pnpm pack of the local delightstack checkout) until
# @delightstack/database + websocket publish the next patch release. After
# `pnpm changeset publish` in the delightstack repo: delete these overrides and
# the vendor/ directory, then `pnpm install`.
overrides:
  "@delightstack/database": "file:./vendor/delightstack-database.tgz"
  "@delightstack/websocket": "file:./vendor/delightstack-websocket.tgz"

allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@delightstack/ai"
  - "@delightstack/auth"
  - "@delightstack/components"
  - "@delightstack/database"
  - "@delightstack/editor"
  - "@delightstack/images"
  - "@delightstack/rate-limiter"
  - "@delightstack/styles"
  - "@delightstack/utilities"
  - "@delightstack/websocket"
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@sveltejs/kit"
