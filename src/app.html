<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Flash-free theme: apply the saved preference before first paint.
			try {
				const t = localStorage.getItem('dm-theme') || 'system';
				const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Per-scheme theme color: light chrome in light mode, dark in dark. -->
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Mail" />
		%sveltekit.head%
	</head>
	<!-- "tap" (not "hover"): hover never fires on touch, so mobile would lose
	     preloading entirely; on desktop tap-preload still races ahead of the click. -->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
